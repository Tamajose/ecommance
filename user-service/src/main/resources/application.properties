spring.application.name=user-service

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/ecommance_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=admin
spring.security.user.password=admin

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8090/login/oauth2/code/google

# Where the popup is bounced back to after Google login
app.frontend-url=http://localhost:5173


internal.api-key=${INTERNAL_API_KEY:dev-internal-key}
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}