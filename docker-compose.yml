services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommance-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ecommance_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: ecommance-user-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommance_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports:
      - "8081:8081"

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: ecommance-product-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommance_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
    ports:
      - "8082:8082"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ecommance-order-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommance_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8085
    ports:
      - "8083:8083"

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ecommance-payment-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommance_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      ORDER_SERVICE_URL: http://order-service:8083
    ports:
      - "8085:8085"

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: ecommance-cart-service
    restart: always
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    environment:
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
    ports:
      - "8084:8084"

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: ecommance-gateway-service
    restart: always
    depends_on:
      - user-service
      - product-service
      - order-service
      - cart-service
      - payment-service
    environment:
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      CART_SERVICE_URL: http://cart-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
    ports:
      - "8090:8090"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8090
    container_name: ecommance-frontend
    restart: always
    depends_on:
      - gateway-service
    ports:
      - "5173:80"

volumes:
  pgdata:
